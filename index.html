<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,"><title>车手大作战</title>
<link rel="stylesheet" href="style.css?v=10"></head><body><div id="app">
<canvas id="cv"></canvas>
<div id="hud" class="hide">
 <div id="hudTop"><div id="avatar"><canvas width="96" height="96"></canvas><span id="lvTag">Lv.1</span></div>
  <div id="hpWrap"><div id="hpName">霓虹毒牙</div><div id="hpBar"><div id="hpLag"></div><div id="hpFill"></div><span id="hpTxt">100</span></div></div>
  <div id="stats"><div class="chip">🚗 <b id="aliveN">8</b></div><div class="chip">💥 <b id="killN">0</b></div><div class="chip">⏱ <b id="timeN">0</b></div></div>
  <button id="muteH" class="mute">🔊</button><button id="pauseBtn" aria-label="暂停">❚❚</button></div>
 <div id="zoneWarn" class="hide">⚡ 电网收缩中</div>
 <div id="joy"><div id="joyRing"></div><div id="knob"></div></div>
 <div id="rev"><span>倒车</span></div>
 <div id="dash"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" class="bg"/><circle id="dashCd" cx="50" cy="50" r="46" class="cd"/></svg><span>冲刺</span></div>
</div>
<div id="intro" class="hide"></div>
<div id="tutBox" class="hide"></div>
<div id="menu" class="panel hide"><div class="logo"><span>车手</span>大作战<small>RACER BRAWL</small></div><div id="cards"></div>
 <button id="muteM" class="mute">🔊</button><div id="auHint" class="hide">🔈 点击开启声音</div>
 <div class="mbtns"><button class="btn ghost" id="menuNick">✏️ <span id="nickTxt"></span></button><span class="coinchip" id="menuCoins"></span><button class="btn ghost" id="menuDaily">🎁 福利</button><button class="btn ghost" id="menuGarage">🔧 车库</button><button class="btn ghost" id="menuSet">⚙ 设置</button></div>
 <div id="help">📱 左半屏按住拖动=浮动摇杆（推幅=油门）· 倒车键倒车 · 冲刺键冲刺　⌨️ W 前进 · S 刹车/倒车 · A/D 转向（方向键同）· 空格冲刺 · Esc 暂停<br>💡 用<b>车头</b>撞对手<b>侧面</b>打出暴击！护好自己的侧面。</div></div>
<div id="maps" class="panel hide"><div class="ptitle">选择地图</div><div id="mapsSub" class="psub"></div><div id="mapList"></div><button class="btn ghost" id="mapsBack">← 返回</button></div>
<div id="garage" class="panel hide"></div>
<div id="daily" class="panel hide"></div>
<div id="match" class="panel hide"></div>
<div id="result" class="panel hide"><div class="rcard"><div id="rRank"></div><div id="rTitle"></div><div id="rStats"></div>
 <div class="xpRow"><span id="rLv"></span><div class="xpBar"><div id="rXp"></div></div><span id="rXpTxt"></span></div>
 <div id="rBoard"></div><div id="rShards"></div><button id="rDouble" class="btn adbtn hide">📺 看视频 碎片翻倍</button><div id="rHint" class="hide"></div><div class="btns"><button id="again" class="btn">再来一局</button><button id="toGarage" class="btn ghost">车库</button><button id="back" class="btn ghost">菜单</button></div></div></div>
<div id="pause" class="panel hide"><div class="rcard"><div class="ptitle">暂停</div><div class="col"><button class="btn" id="pResume">继续</button><button class="btn ghost" id="pSet">⚙ 设置</button><button class="btn ghost" id="pQuit">退出到菜单</button></div></div></div>
<div id="settings" class="panel hide"><div class="rcard set"><div class="ptitle">设置</div>
 <label class="srow2"><span>主音量</span><input type="range" id="sVol" min="0" max="100"><b id="sVolV"></b></label>
 <label class="srow2"><span>音乐</span><input type="checkbox" id="s_music" class="sw"></label>
 <label class="srow2"><span>音效</span><input type="checkbox" id="s_sfx" class="sw"></label>
 <div class="srow2"><span>声音</span><button class="btn sm" id="sTest">🔊 测试声音</button><small id="sAuSt"></small></div>
 <label class="srow2"><span>震动</span><input type="checkbox" id="s_vibrate" class="sw"></label>
 <div class="srow2"><span>画质</span><div class="seg"><button data-q="auto">自动</button><button data-q="high">高</button><button data-q="low">低</button></div><small id="sQNow"></small></div>
 <div class="srow2"><span>AI 难度</span><div class="seg"><button data-diff="easy">简单</button><button data-diff="normal">普通</button><button data-diff="hard">困难</button></div></div>
 <div class="col"><button class="btn ghost sm" id="sTut">重玩新手引导</button><button class="btn" id="sClose">完成</button></div></div></div>
<div id="toast" class="hide"></div>
<div id="loading" class="panel">加载中…</div>
</div><script src="game.js?v=10"></script></body></html>
